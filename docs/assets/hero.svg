<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img"
     aria-labelledby="title desc">
  <title id="title">schema_reaper</title>
  <desc id="desc">schema_reaper: find and safely remove dead columns, tables and indexes in Rails and
  PostgreSQL apps. Illustration: a users table being scanned, with api_key and legacy_score flagged dead.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0906"/><stop offset=".55" stop-color="#120708"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0" stop-color="#ffb3ad"/><stop offset=".5" stop-color="#ff5a4f"/><stop offset="1" stop-color="#cc342d"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7b72" stop-opacity="0"/><stop offset=".85" stop-color="#ff7b72" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff7b72" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="card"><rect x="800" y="66" width="320" height="236" rx="10"/></clipPath>
  </defs>
  <style>
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    .chip { opacity: 0; animation: fade .6s ease-out forwards; }
    .hl { animation: hl .9s ease-out forwards; }
    .dead .hl { animation: hlDead .9s ease-out forwards; }
    .strike { stroke-dasharray: 200; stroke-dashoffset: 200; animation: strike .5s ease-out forwards; }
    .tag { opacity: 0; animation: fade .4s ease-out forwards; }
    .scan { animation: scan 2.4s cubic-bezier(.4,0,.2,1) 1s 1 forwards; opacity: 0; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes hl { 0% { opacity: 0; } 30% { opacity: .08; } 100% { opacity: 0; } }
    @keyframes hlDead { 0% { opacity: 0; } 30% { opacity: .28; } 100% { opacity: .12; } }
    @keyframes strike { to { stroke-dashoffset: 0; } }
    @keyframes scan { 0% { opacity: 1; transform: translateY(0); } 90% { opacity: 1; } 100% { opacity: 0; transform: translateY(236px); } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .chip, .tag { animation: none; opacity: 1; }
      .strike { animation: none; stroke-dashoffset: 0; }
      .hl, .scan { animation: none; } .dead .hl { animation: none; opacity: .12; }
    }
  </style>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <g class="fade">
    <text x="64" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#ff7b72">RUBY GEM · RAILS + POSTGRESQL</text>
    <text x="60" y="160" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="64" font-weight="800" fill="url(#brand)">schema_reaper</text>
    <text x="64" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#e6edf3">Find — and safely remove — the dead columns, tables</text>
    <text x="64" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#e6edf3">and indexes your Rails app no longer uses.</text>
  </g>
  <g class="chip" style="animation-delay:0.60s">
      <rect x="64" y="252" width="118" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="123" y="273" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#f0c9c6">7 analyzers</text></g><g class="chip" style="animation-delay:0.75s">
      <rect x="194.2" y="252" width="167" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="278" y="273" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#f0c9c6">staged migrations</text></g><g class="chip" style="animation-delay:0.90s">
      <rect x="373.59999999999997" y="252" width="159" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="453" y="273" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#f0c9c6">CI baseline gate</text></g><g class="chip" style="animation-delay:1.05s">
      <rect x="544.8" y="252" width="225" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="657" y="273" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14" fill="#f0c9c6">scheduled scans + alerts</text></g>

  <g class="fade" style="animation-delay:.3s">
    <rect x="800" y="66" width="320" height="236" rx="10" fill="#0d1117" fill-opacity=".85" stroke="#30363d"/>
    <text x="818" y="88" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#d2a8ff">users</text>
    <text x="1102" y="88" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e" text-anchor="end">~3,000 rows</text>
    <line x1="800" y1="98" x2="1120" y2="98" stroke="#30363d"/>
    <g clip-path="url(#card)">
    <g>
      <rect class="hl" x="801" y="101" width="318" height="32" fill="#ff7b72" opacity="0"
            style="animation-delay:1.10s"/>
      <text x="818" y="122" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#e6edf3">id</text>
      <text x="1102" y="122" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e" text-anchor="end">bigint</text>
      
    </g><line x1="800" y1="133" x2="1120" y2="133" stroke="#30363d"/>
    <g>
      <rect class="hl" x="801" y="133" width="318" height="32" fill="#ff7b72" opacity="0"
            style="animation-delay:1.45s"/>
      <text x="818" y="154" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#e6edf3">email</text>
      <text x="1102" y="154" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e" text-anchor="end">varchar</text>
      
    </g><line x1="800" y1="165" x2="1120" y2="165" stroke="#30363d"/>
    <g>
      <rect class="hl" x="801" y="165" width="318" height="32" fill="#ff7b72" opacity="0"
            style="animation-delay:1.80s"/>
      <text x="818" y="186" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#e6edf3">team_id</text>
      <text x="1102" y="186" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e" text-anchor="end">bigint</text>
      
    </g><line x1="800" y1="197" x2="1120" y2="197" stroke="#30363d"/>
    <g class="dead">
      <rect class="hl" x="801" y="197" width="318" height="32" fill="#ff7b72" opacity="0"
            style="animation-delay:2.15s"/>
      <text x="818" y="218" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#e6edf3">api_key</text>
      <text x="1102" y="218" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e" text-anchor="end">varchar</text>
      <line class="strike" x1="814" y1="213" x2="884" y2="213" stroke="#ff7b72" stroke-width="2" style="animation-delay:2.40s"/><text class="tag" x="1010" y="218" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#ff7b72" font-weight="700" text-anchor="end" style="animation-delay:2.50s">dead</text>
    </g><line x1="800" y1="229" x2="1120" y2="229" stroke="#30363d"/>
    <g class="dead">
      <rect class="hl" x="801" y="229" width="318" height="32" fill="#ff7b72" opacity="0"
            style="animation-delay:2.50s"/>
      <text x="818" y="250" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#e6edf3">legacy_score</text>
      <text x="1102" y="250" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e" text-anchor="end">integer</text>
      <line class="strike" x1="814" y1="245" x2="930" y2="245" stroke="#ff7b72" stroke-width="2" style="animation-delay:2.75s"/><text class="tag" x="1010" y="250" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#ff7b72" font-weight="700" text-anchor="end" style="animation-delay:2.85s">dead</text>
    </g><line x1="800" y1="261" x2="1120" y2="261" stroke="#30363d"/>
    <g>
      <rect class="hl" x="801" y="261" width="318" height="32" fill="#ff7b72" opacity="0"
            style="animation-delay:2.85s"/>
      <text x="818" y="282" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#e6edf3">created_at</text>
      <text x="1102" y="282" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e" text-anchor="end">timestamp</text>
      
    </g>
      <rect class="scan" x="800" y="38" width="320" height="30" fill="url(#sweep)"/>
    </g>
  </g>
</svg>
