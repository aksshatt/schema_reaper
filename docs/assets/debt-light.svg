<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="192" viewBox="0 0 1000 192" role="img"
     aria-labelledby="title desc">
  <title id="title">What schema_reaper finds</title>
  <desc id="desc">Three kinds of schema debt. Dead weight: dead_column, dead_table. Index trouble: unused_index, duplicate_index, missing_fk_index. Degenerate data: always_null_column, single_value_column.</desc>
  <style>
    .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out 1.2s infinite; transform-box: fill-box; transform-origin: center; }
    .grow { transform-box: fill-box; transform-origin: left center; }
    .strike { stroke-dasharray: 200; }
    .scan { opacity: 0; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes ac511c1 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 0.00% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 4.17% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .ac511c1 { animation: ac511c1 12s linear infinite; }
    @keyframes ac511c2 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 1.25% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 5.42% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .ac511c2 { animation: ac511c2 12s linear infinite; }
    @keyframes ac511c3 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 2.50% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 6.67% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .ac511c3 { animation: ac511c3 12s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<g class="pop ac511c1">
      <rect x="8" y="8" width="312" height="176" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
      <path d="M8 22a14 14 0 0 1 14-14h284a14 14 0 0 1 14 14v2H8z" fill="#cc342d"/>
      <text x="28" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f2328">Dead weight</text>
      <text x="28" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">nothing references it any more</text>
      <text x="28" y="104" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#1f2328"><tspan fill="#cc342d">▸</tspan> dead_column</text><text x="28" y="130" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#1f2328"><tspan fill="#cc342d">▸</tspan> dead_table</text></g>
<g class="pop ac511c2">
      <rect x="344" y="8" width="312" height="176" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
      <path d="M344 22a14 14 0 0 1 14-14h284a14 14 0 0 1 14 14v2H344z" fill="#0969da"/>
      <text x="364" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f2328">Index trouble</text>
      <text x="364" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">costs writes, or missing where needed</text>
      <text x="364" y="104" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#1f2328"><tspan fill="#0969da">▸</tspan> unused_index</text><text x="364" y="130" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#1f2328"><tspan fill="#0969da">▸</tspan> duplicate_index</text><text x="364" y="156" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#1f2328"><tspan fill="#0969da">▸</tspan> missing_fk_index</text></g>
<g class="pop ac511c3">
      <rect x="680" y="8" width="312" height="176" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
      <path d="M680 22a14 14 0 0 1 14-14h284a14 14 0 0 1 14 14v2H680z" fill="#9a6700"/>
      <text x="700" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f2328">Degenerate data</text>
      <text x="700" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">the data itself says it&#x27;s dead</text>
      <text x="700" y="104" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#1f2328"><tspan fill="#9a6700">▸</tspan> always_null_column</text><text x="700" y="130" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#1f2328"><tspan fill="#9a6700">▸</tspan> single_value_column</text></g>
</svg>
