<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img"
     aria-labelledby="title desc">
  <title id="title">The staged removal path</title>
  <desc id="desc">generate-migration writes two migrations. Step 1 adds the column to ignored_columns and is deployed; nothing is dropped. Once it has soaked in production and nothing reads the column, step 2 runs remove_column, which is irreversible.</desc>
  <style>
    .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out 1.2s infinite; transform-box: fill-box; transform-origin: center; }
    .grow { transform-box: fill-box; transform-origin: left center; }
    .strike { stroke-dasharray: 200; }
    .scan { opacity: 0; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes a496731 { 0% { transform:scaleX(0);animation-timing-function:step-end } 7.50% { transform:scaleX(0);animation-timing-function:cubic-bezier(.4,0,.2,1) } 25.83% { transform:scaleX(1) } 91.67% { transform:scaleX(1);animation-timing-function:ease-in } 96.25% { transform:scaleX(0) } 100% { transform:scaleX(0) } }
    .a496731 { animation: a496731 12s linear infinite; }
    @keyframes a496732 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 1.67% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 5.83% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a496732 { animation: a496732 12s linear infinite; }
    @keyframes a496733 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 5.42% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 9.58% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a496733 { animation: a496733 12s linear infinite; }
    @keyframes a496734 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 9.17% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 13.33% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a496734 { animation: a496734 12s linear infinite; }
    @keyframes a496735 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 12.92% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 17.08% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a496735 { animation: a496735 12s linear infinite; }
    @keyframes a496736 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 10.83% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 15.00% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a496736 { animation: a496736 12s linear infinite; }
    @keyframes a496737 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 17.50% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 21.67% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a496737 { animation: a496737 12s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<line x1="60" y1="92" x2="940" y2="92" stroke="#d0d7de" stroke-width="4" stroke-linecap="round"/>
<line class="grow a496731" x1="60" y1="92" x2="940" y2="92" stroke="#1a7f37" stroke-width="4" stroke-linecap="round"/>
<g class="pop a496732">
      <circle cx="60" cy="92" r="15" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/>
      <circle cx="60" cy="92" r="5" fill="#0969da"/>
      <text x="60" y="60" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f2328">generate-migration</text>
      <text x="60" y="134" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#59636e">writes the pair</text></g>
<g class="pop a496733">
      <circle cx="340" cy="92" r="15" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/>
      <circle cx="340" cy="92" r="5" fill="#1a7f37"/>
      <text x="340" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f2328">1 · ignore</text>
      <text x="340" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#59636e">self.ignored_columns += %w[col]</text></g>
<g class="pop a496734">
      <circle cx="610" cy="92" r="15" fill="#fff8c5" stroke="#9a6700" stroke-width="3"/>
      <circle cx="610" cy="92" r="5" fill="#9a6700"/>
      <text x="610" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f2328">soak in production</text>
      <text x="610" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#59636e">until nothing reads it</text></g>
<g class="pop a496735">
      <circle cx="940" cy="92" r="15" fill="#ffebe9" stroke="#cf222e" stroke-width="3"/>
      <circle cx="940" cy="92" r="5" fill="#cf222e"/>
      <text x="940" y="60" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1f2328">2 · drop</text>
      <text x="940" y="134" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#59636e">remove_column — irreversible</text></g>
<g class="pop a496736">
      <rect x="250" y="160" width="180" height="28" rx="14" fill="#dafbe1"/>
      <text x="340" y="179" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1a7f37">nothing dropped yet</text></g>
<g class="pop a496737">
      <rect x="760" y="160" width="180" height="28" rx="14" fill="#ffebe9"/>
      <text x="850" y="179" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#cf222e">only after the soak</text></g>
</svg>
