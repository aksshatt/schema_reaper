<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img"
     aria-labelledby="title desc">
  <title id="title">How production automation runs</title>
  <desc id="desc">whenever or cron runs rake schema_reaper:alert, sidekiq-cron enqueues the job directly, and the token-protected manual trigger POST /internal/schema_scan enqueues it on demand. All three run SchemaReaper::ScanJob, which scans the live database and your code; the Notifier then sends the report to a Slack-compatible webhook and by email through your ApplicationMailer.</desc>
  <style>
    .pop { opacity: 0; animation: pop .5s ease-out forwards; }
    .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out 1.2s infinite; transform-box: fill-box; transform-origin: center; }
    .grow { transform: scaleX(0); transform-box: fill-box; transform-origin: left center;
            animation: grow 2.2s cubic-bezier(.4,0,.2,1) .9s forwards; }
    .progress { transform: scaleX(0); transform-box: fill-box; transform-origin: left center;
                stroke-dasharray: 10 8;
                animation: grow 2.2s cubic-bezier(.4,0,.2,1) .9s forwards, progressFlow 1s linear infinite; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @keyframes progressFlow { to { stroke-dashoffset: -18; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .pop { animation: none; opacity: 1; } .flow, .pulse { animation: none; }
      .grow, .progress { animation: none; transform: none; }
    }
  </style>
<path class="flow" d="M250 55 C 295.0 55, 295.0 160.0, 340 160.0" fill="none" stroke="#cc342d" stroke-width="2" stroke-opacity=".75"/>
<path class="flow" d="M250 160 C 295.0 160, 295.0 160.0, 340 160.0" fill="none" stroke="#cc342d" stroke-width="2" stroke-opacity=".75"/>
<path class="flow" d="M250 265 C 295.0 265, 295.0 160.0, 340 160.0" fill="none" stroke="#cc342d" stroke-width="2" stroke-opacity=".75"/>
<path class="flow" d="M560 160.0 C 590.0 160.0, 590.0 160.0, 620 160.0" fill="none" stroke="#cc342d" stroke-width="2" stroke-opacity=".75"/>
<path class="flow" d="M760 160.0 C 780.0 160.0, 780.0 95, 800 95" fill="none" stroke="#cc342d" stroke-width="2" stroke-opacity=".75"/>
<path class="flow" d="M760 160.0 C 780.0 160.0, 780.0 225, 800 225" fill="none" stroke="#cc342d" stroke-width="2" stroke-opacity=".75"/>
<g class="pop" style="animation-delay:0.00s"><rect x="20" y="20" width="230" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="36" y="51" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328">whenever / cron</text><text x="36" y="71" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">runs rake schema_reaper:alert</text></g>
<g class="pop" style="animation-delay:0.12s"><rect x="20" y="125" width="230" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="36" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328">sidekiq-cron</text><text x="36" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">enqueues the job directly</text></g>
<g class="pop" style="animation-delay:0.24s"><rect x="20" y="230" width="230" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="5 4"/><text x="36" y="261" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328">Manual trigger</text><text x="36" y="281" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">POST /internal/schema_scan</text></g>
<g class="pop" style="animation-delay:.45s">
      <rect class="pulse" x="340" y="110" width="220" height="100" rx="14" fill="#fff1f0" stroke="#cc342d" stroke-width="1.5"/>
      <text x="358" y="146" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1f2328">SchemaReaper::ScanJob</text>
      <text x="358" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">scans the live DB + your code</text>
      <text x="358" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">one job for every path</text></g>
<g class="pop" style="animation-delay:0.60s"><rect x="620" y="125" width="140" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="636" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328">Notifier</text><text x="636" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">both channels fire</text></g>
<g class="pop" style="animation-delay:0.75s"><rect x="800" y="60" width="180" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="816" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328">Webhook</text><text x="816" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">Slack-compatible JSON</text></g>
<g class="pop" style="animation-delay:0.87s"><rect x="800" y="190" width="180" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="816" y="221" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2328">Email</text><text x="816" y="241" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#59636e">via your ApplicationMailer</text></g>
<text class="pop" style="animation-delay:.9s" x="20" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#59636e">default schedule: quarterly  ·  manual trigger: bearer token, 5-minute cooldown  ·  delivery failures are logged, never raised</text>
</svg>
