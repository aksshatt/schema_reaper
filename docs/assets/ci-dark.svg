<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img"
     aria-labelledby="title desc">
  <title id="title">The CI baseline gate</title>
  <desc id="desc">On each pull request, schema_reaper scan --ci compares the findings with the committed baseline.json. It passes when every finding is already in the baseline and exits 1 when the change adds new dead weight.</desc>
  <style>
    .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out 1.2s infinite; transform-box: fill-box; transform-origin: center; }
    .grow { transform-box: fill-box; transform-origin: left center; }
    .strike { stroke-dasharray: 200; }
    .scan { opacity: 0; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes a7384c1 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 0.00% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 4.17% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a7384c1 { animation: a7384c1 12s linear infinite; }
    @keyframes a7384c2 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 1.67% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 5.83% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a7384c2 { animation: a7384c2 12s linear infinite; }
    @keyframes a7384c3 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 3.33% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 7.50% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a7384c3 { animation: a7384c3 12s linear infinite; }
    @keyframes a7384c4 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 5.42% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 9.58% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a7384c4 { animation: a7384c4 12s linear infinite; }
    @keyframes a7384c5 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 6.67% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 10.83% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a7384c5 { animation: a7384c5 12s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<path class="flow" d="M200 100 C 225.0 100, 225.0 100, 250 100" fill="none" stroke="#ff7b72" stroke-width="2" stroke-opacity=".75"/>
<path class="flow" d="M530 100 C 560.0 100, 560.0 100, 590 100" fill="none" stroke="#ff7b72" stroke-width="2" stroke-opacity=".75"/>
<path class="flow" d="M790 100 C 810.0 100, 810.0 45, 830 45" fill="none" stroke="#3fb950" stroke-width="2" stroke-opacity=".75"/>
<path class="flow" d="M790 100 C 810.0 100, 810.0 155, 830 155" fill="none" stroke="#ff7b72" stroke-width="2" stroke-opacity=".75"/>
<g class="pop a7384c1"><rect x="20" y="65" width="180" height="70" rx="12" fill="#161b22" stroke="#30363d"/><text x="36" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Pull request</text><text x="36" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">adds or changes code</text></g>
<g class="pop a7384c2"><rect x="250" y="65" width="280" height="70" rx="12" fill="#161b22" stroke="#30363d"/><text x="266" y="96" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="600" fill="#e6edf3">schema_reaper scan --ci</text><text x="266" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">--format sarif &gt; reaper.sarif</text></g>
<g class="pop a7384c3">
      <rect class="pulse" x="590" y="60" width="200" height="80" rx="14" fill="#2a1113" stroke="#ff7b72" stroke-width="1.5"/>
      <text x="606" y="93" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">compare with</text>
      <text x="606" y="116" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">baseline.json</text></g>
<g class="pop a7384c4"><rect x="830" y="12" width="160" height="66" rx="12" fill="#12261a" stroke="#3fb950"/><text x="846" y="41" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">✓ passes</text><text x="846" y="61" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">only known findings</text></g>
<g class="pop a7384c5"><rect x="830" y="122" width="160" height="66" rx="12" fill="#2a1113" stroke="#ff7b72"/><text x="846" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">✗ exit 1</text><text x="846" y="171" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">new dead weight</text></g>
</svg>
