<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img"
     aria-labelledby="title desc">
  <title id="title">The staged removal path</title>
  <desc id="desc">generate-migration writes two migrations. Step 1 adds the column to ignored_columns and is deployed; nothing is dropped. Once it has soaked in production and nothing reads the column, step 2 runs remove_column, which is irreversible.</desc>
  <style>
    .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out 1.2s infinite; transform-box: fill-box; transform-origin: center; }
    .grow { transform-box: fill-box; transform-origin: left center; }
    .strike { stroke-dasharray: 200; }
    .scan { opacity: 0; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes a3caea1 { 0% { transform:scaleX(0);animation-timing-function:step-end } 7.50% { transform:scaleX(0);animation-timing-function:cubic-bezier(.4,0,.2,1) } 25.83% { transform:scaleX(1) } 91.67% { transform:scaleX(1);animation-timing-function:ease-in } 96.25% { transform:scaleX(0) } 100% { transform:scaleX(0) } }
    .a3caea1 { animation: a3caea1 12s linear infinite; }
    @keyframes a3caea2 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 1.67% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 5.83% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a3caea2 { animation: a3caea2 12s linear infinite; }
    @keyframes a3caea3 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 5.42% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 9.58% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a3caea3 { animation: a3caea3 12s linear infinite; }
    @keyframes a3caea4 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 9.17% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 13.33% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a3caea4 { animation: a3caea4 12s linear infinite; }
    @keyframes a3caea5 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 12.92% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 17.08% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a3caea5 { animation: a3caea5 12s linear infinite; }
    @keyframes a3caea6 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 10.83% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 15.00% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a3caea6 { animation: a3caea6 12s linear infinite; }
    @keyframes a3caea7 { 0% { opacity:0;transform:translateY(6px);animation-timing-function:step-end } 17.50% { opacity:0;transform:translateY(6px);animation-timing-function:ease-out } 21.67% { opacity:1;transform:none } 91.67% { opacity:1;transform:none;animation-timing-function:ease-in } 96.25% { opacity:0;transform:translateY(6px) } 100% { opacity:0;transform:translateY(6px) } }
    .a3caea7 { animation: a3caea7 12s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
<line x1="60" y1="92" x2="940" y2="92" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
<line class="grow a3caea1" x1="60" y1="92" x2="940" y2="92" stroke="#3fb950" stroke-width="4" stroke-linecap="round"/>
<g class="pop a3caea2">
      <circle cx="60" cy="92" r="15" fill="#0f2233" stroke="#79c0ff" stroke-width="3"/>
      <circle cx="60" cy="92" r="5" fill="#79c0ff"/>
      <text x="60" y="60" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">generate-migration</text>
      <text x="60" y="134" text-anchor="start" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8b949e">writes the pair</text></g>
<g class="pop a3caea3">
      <circle cx="340" cy="92" r="15" fill="#12261a" stroke="#3fb950" stroke-width="3"/>
      <circle cx="340" cy="92" r="5" fill="#3fb950"/>
      <text x="340" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">1 · ignore</text>
      <text x="340" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8b949e">self.ignored_columns += %w[col]</text></g>
<g class="pop a3caea4">
      <circle cx="610" cy="92" r="15" fill="#2b2210" stroke="#e3b341" stroke-width="3"/>
      <circle cx="610" cy="92" r="5" fill="#e3b341"/>
      <text x="610" y="60" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">soak in production</text>
      <text x="610" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8b949e">until nothing reads it</text></g>
<g class="pop a3caea5">
      <circle cx="940" cy="92" r="15" fill="#2a1113" stroke="#ff7b72" stroke-width="3"/>
      <circle cx="940" cy="92" r="5" fill="#ff7b72"/>
      <text x="940" y="60" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">2 · drop</text>
      <text x="940" y="134" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#8b949e">remove_column — irreversible</text></g>
<g class="pop a3caea6">
      <rect x="250" y="160" width="180" height="28" rx="14" fill="#12261a"/>
      <text x="340" y="179" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#3fb950">nothing dropped yet</text></g>
<g class="pop a3caea7">
      <rect x="760" y="160" width="180" height="28" rx="14" fill="#2a1113"/>
      <text x="850" y="179" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#ff7b72">only after the soak</text></g>
</svg>
