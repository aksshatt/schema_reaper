<svg xmlns="http://www.w3.org/2000/svg" width="880" height="483" viewBox="0 0 880 483" role="img"
     aria-labelledby="title desc">
  <title id="title">schema_reaper scan -- example terminal output</title>
  <desc id="desc">Running bundle exec schema_reaper scan prints 3 findings across 2 tables: a missing
  foreign-key index on users.team_id, an always-null users.api_key column reclaiming 46.9 KB, and an
  unreferenced empty stale_exports table, each with a confidence bar, severity and a suggested fix.</desc>
  <style>
    .t { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size: 13px; white-space: pre; }
    .l { opacity: 0; animation: in .35s ease-out forwards; }
    .cmd { clip-path: inset(0 100% 0 0); animation: type 1.35s steps(30, end) 0.5s forwards; }
    .cursor { animation: move 1.35s steps(30, end) 0.5s forwards, blink 1s step-end infinite; }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes move { to { transform: translateX(234.0px); } }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } .cmd { animation: none; clip-path: none; } .cursor { animation: none; transform: translateX(234.0px); } }
  </style>
  <rect width="880" height="483" rx="12" fill="#0d1117"/>
  <rect x=".5" y=".5" width="879" height="482" rx="11.5" fill="none" stroke="#30363d"/>
  <path d="M12 .5h856a11.5 11.5 0 0 1 11.5 11.5v20H.5V12A11.5 11.5 0 0 1 12 .5z" fill="#161b22"/>
  <line x1="0" y1="32" x2="880" y2="32" stroke="#30363d"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <text x="440.0" y="20" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">~/my_app — schema_reaper scan</text>

  <text x="22" y="70" class="t"><tspan fill="#3fb950" font-weight="700">$</tspan></text>
  <text x="37.6" y="70" class="t cmd" fill="#e6edf3">bundle exec schema_reaper scan</text>
  <rect class="cursor" x="37.6" y="58" width="7.8" height="15" fill="#e6edf3"/>
  <text x="22" y="108" class="t l" xml:space="preserve" style="animation-delay:2.39s"><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">schema_reaper</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">3 findings across 2 tables</tspan></text>
  <text x="22" y="127" class="t l" xml:space="preserve" style="animation-delay:2.48s"><tspan fill="#8b949e">  missing_fk_index 1 · always_null_column 1 · dead_table 1</tspan></text>
  <text x="22" y="146" class="t l" xml:space="preserve" style="animation-delay:2.57s"><tspan fill="#8b949e">  ~46.9 KB reclaimable</tspan></text>
  <text x="22" y="184" class="t l" xml:space="preserve" style="animation-delay:2.75s"><tspan fill="#e6edf3">  </tspan><tspan fill="#d2a8ff" font-weight="700">users</tspan></text>
  <text x="22" y="203" class="t l" xml:space="preserve" style="animation-delay:2.84s"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">█████</tspan><tspan fill="#e6edf3">  90%  </tspan><tspan fill="#e3b341" font-weight="700">medium</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">missing_fk_index   </tspan><tspan fill="#e6edf3">  team_id</tspan></text>
  <text x="22" y="222" class="t l" xml:space="preserve" style="animation-delay:2.93s"><tspan fill="#8b949e">           team_id has no covering index (declared foreign key constraint)</tspan></text>
  <text x="22" y="241" class="t l" xml:space="preserve" style="animation-delay:3.02s"><tspan fill="#3fb950">           → add_index :users, :team_id</tspan></text>
  <text x="22" y="260" class="t l" xml:space="preserve" style="animation-delay:3.11s"><tspan fill="#e6edf3">    </tspan><tspan fill="#ff7b72">████░</tspan><tspan fill="#e6edf3">  85%  </tspan><tspan fill="#ff7b72" font-weight="700">high  </tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">always_null_column </tspan><tspan fill="#e6edf3">  api_key</tspan><tspan fill="#8b949e">  46.9 KB</tspan></text>
  <text x="22" y="279" class="t l" xml:space="preserve" style="animation-delay:3.20s"><tspan fill="#8b949e">           pg_stats.null_frac = 1.0 across ~3000 row(s) · column carries no data</tspan></text>
  <text x="22" y="298" class="t l" xml:space="preserve" style="animation-delay:3.29s"><tspan fill="#3fb950">           → verify with `SELECT count(api_key) FROM users` then stage a removal</tspan></text>
  <text x="22" y="336" class="t l" xml:space="preserve" style="animation-delay:3.47s"><tspan fill="#e6edf3">  </tspan><tspan fill="#d2a8ff" font-weight="700">stale_exports</tspan></text>
  <text x="22" y="355" class="t l" xml:space="preserve" style="animation-delay:3.56s"><tspan fill="#e6edf3">    </tspan><tspan fill="#ff7b72">████░</tspan><tspan fill="#e6edf3">  85%  </tspan><tspan fill="#ff7b72" font-weight="700">high  </tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#e6edf3" font-weight="700">dead_table</tspan></text>
  <text x="22" y="374" class="t l" xml:space="preserve" style="animation-delay:3.65s"><tspan fill="#8b949e">           no model or query reference to `stale_exports` in scanned code · table holds ~0 row(s)</tspan></text>
  <text x="22" y="393" class="t l" xml:space="preserve" style="animation-delay:3.74s"><tspan fill="#3fb950">           → confirm no external consumer, then `drop_table :stale_exports`</tspan></text>
  <text x="22" y="431" class="t l" xml:space="preserve" style="animation-delay:3.92s"><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72" font-weight="700">high 2</tspan><tspan fill="#e6edf3">   </tspan><tspan fill="#e3b341" font-weight="700">medium 1</tspan></text>
  <text x="22" y="450" class="t l" xml:space="preserve" style="animation-delay:4.01s"><tspan fill="#8b949e">  missing_fk_index 1 · always_null_column 1 · dead_table 1</tspan></text>
</svg>
